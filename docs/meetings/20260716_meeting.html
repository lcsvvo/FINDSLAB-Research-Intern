          &lt;ul class=&quot;outputs&quot;&gt;&lt;li&gt;&lt;code&gt;results/Asymmetry/tables/asymmetry_wald_tests.csv&lt;/code&gt;&lt;/li&gt;&lt;li&gt;&lt;code&gt;results/Asymmetry/tables/key_factor_asymmetry_tests.csv&lt;/code&gt;&lt;/li&gt;&lt;li&gt;&lt;code&gt;results/Asymmetry/figures/up_down_beta_ci.png&lt;/code&gt;&lt;/li&gt;&lt;li&gt;&lt;code&gt;results/Asymmetry/summary.md&lt;/code&gt;&lt;/li&gt;&lt;/ul&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/article&gt;
    &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;3&lt;/div&gt;&lt;div&gt;&lt;h2&gt;분석과 시각화 흐름&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;각 조가 자기 모형을 완결한 뒤 마지막에 합친다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;flow&quot;&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;h3&gt;모형 B 완료&lt;/h3&gt;
      &lt;p&gt;수익률곡선·신용스프레드 회귀, 검증, 표와 그래프, 요약문까지 B조가 완성한다.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;h3&gt;모형 C 완료&lt;/h3&gt;
      &lt;p&gt;3년물 비대칭과 B 핵심요인 비대칭, Wald 검정, 표와 그래프까지 C조가 완성한다.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;arrow&quot;&gt;→&lt;/div&gt;
    &lt;div class=&quot;flow-card&quot;&gt;
      &lt;h3&gt;최종 병합&lt;/h3&gt;
      &lt;p&gt;B조 summary와 C조 summary를 붙이고, 공통 결론·한계·다음 단계만 함께 작성한다.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;4&lt;/div&gt;&lt;div&gt;&lt;h2&gt;7일 일정&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;B조가 핵심요인을 확정하면 C조가 이를 비대칭 분석에 반영한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;timeline&quot;&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 1&lt;/div&gt;&lt;div&gt;&lt;h3&gt;조별 준비&lt;/h3&gt;&lt;p&gt;B조는 금리자료 병합·요인 생성, C조는 3년물 상승·하락 변수와 회귀·Wald 검정 코드 틀을 준비한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 2&lt;/div&gt;&lt;div&gt;&lt;h3&gt;모형 B 핵심 추정&lt;/h3&gt;&lt;p&gt;B-1은 만기별·곡선요인 회귀, B-2는 Credit spread와 검증을 진행한다. C조는 3년물 기본 비대칭 회귀를 시작한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 3&lt;/div&gt;&lt;div&gt;&lt;h3&gt;모형 B 결과 검수&lt;/h3&gt;&lt;p&gt;B조는 계수·p값·VIF·BH 보정을 상호 검토하고 표와 그래프 초안을 만든다. C조는 3년물 비대칭 결과를 정리한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 4&lt;/div&gt;&lt;div&gt;&lt;h3&gt;모형 B 완료&lt;/h3&gt;&lt;p&gt;B조가 핵심 금리요인 1개를 확정해 C조에 전달하고 모형 B 표·시각화·summary를 완성한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 5&lt;/div&gt;&lt;div&gt;&lt;h3&gt;모형 C 확장&lt;/h3&gt;&lt;p&gt;C조는 모형 B 핵심요인을 상승·하락으로 분리하고 Wald 검정과 BH 보정을 실행한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 6&lt;/div&gt;&lt;div&gt;&lt;h3&gt;모형 C 완료&lt;/h3&gt;&lt;p&gt;C조가 표·시각화·summary를 완성한다. 두 조는 상대 조 결과를 한 번씩 재실행해 교차검수한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;day&quot;&gt;&lt;div class=&quot;day-label&quot;&gt;DAY 7&lt;/div&gt;&lt;div&gt;&lt;h3&gt;최종 병합&lt;/h3&gt;&lt;p&gt;모형 B와 C의 완성된 summary·표·그림을 하나의 HTML로 합치고 공통 결론과 한계를 작성한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;

&lt;section&gt;
  &lt;div class=&quot;sec-head&quot;&gt;&lt;div class=&quot;num&quot;&gt;5&lt;/div&gt;&lt;div&gt;&lt;h2&gt;공동 규칙&lt;/h2&gt;&lt;p class=&quot;subtitle&quot;&gt;두 조의 결과가 자연스럽게 연결되도록 기준을 통일한다.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
  &lt;div class=&quot;check-grid&quot;&gt;
    &lt;div class=&quot;check&quot;&gt;&lt;strong&gt;모형 B 선행&lt;/strong&gt;&lt;span&gt;모형 C의 핵심요인 확장은 모형 B 결과가 나온 뒤 확정한다.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;check&quot;&gt;&lt;strong&gt;조별 완결&lt;/strong&gt;&lt;span&gt;각 조가 자기 모형의 코드·표·그림·summary까지 전부 완성한다.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;check&quot;&gt;&lt;strong&gt;비대칭 검정&lt;/strong&gt;&lt;span&gt;βup와 βdown의 직접 Wald 검정으로 비대칭을 판정한다.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;check&quot;&gt;&lt;strong&gt;단위&lt;/strong&gt;&lt;span&gt;금리는 연 %, 변화분은 %p, 일별수익률은 소수로 통일한다.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;check&quot;&gt;&lt;strong&gt;표준오차&lt;/strong&gt;&lt;span&gt;산업별 회귀는 HAC를 사용하고 다중검정 보정 방식을 통일한다.&lt;/span&gt;&lt;/div&gt;
    &lt;div class=&quot;check&quot;&gt;&lt;strong&gt;최종 병합&lt;/strong&gt;&lt;span&gt;두 summary를 단순 복사하지 말고 공통 결론과 한계를 마지막에 한 번만 작성한다.&lt;/span&gt;&lt;/div&gt;
  &lt;/div&gt;
&lt;/section&gt;
&lt;/main&gt;

&lt;footer&gt;모형 B 2명 · 모형 C 2명 · 모형별 시각화 후 최종 통합&lt;/footer&gt;

&lt;header class=&quot;hero&quot;&gt;&lt;div class=&quot;wrap&quot;&gt;
&lt;div class=&quot;eyebrow&quot;&gt;INDUSTRY RATE BETA · STEP 4&lt;/div&gt;
&lt;h1&gt;STEP4_분석설계&lt;/h1&gt;
&lt;div class=&quot;q&quot;&gt;&lt;b&gt;분석 질문&lt;/b&gt; — 시장 전체 움직임(KOSPI)을 통제한 뒤에도 산업별 수익률이 금리 변화에 서로 다른 방향과 크기로 반응하는가?&lt;/div&gt;
&lt;/div&gt;&lt;/header&gt;
&lt;div class=&quot;wrap&quot;&gt;&lt;div class=&quot;layout&quot;&gt;
&lt;nav&gt;&lt;div class=&quot;toc-t&quot;&gt;목차&lt;/div&gt;
&lt;a href=&quot;#overview&quot;&gt;01 개요&lt;/a&gt;&lt;a href=&quot;#model&quot;&gt;02 회귀모형&lt;/a&gt;&lt;a href=&quot;#steps&quot;&gt;03 세부 단계&lt;/a&gt;&lt;a href=&quot;#outputs&quot;&gt;04 산출물&lt;/a&gt;&lt;a href=&quot;#roles&quot;&gt;05 역할 분담&lt;/a&gt;&lt;a href=&quot;#checklist&quot;&gt;06 체크리스트&lt;/a&gt;&lt;a href=&quot;#next&quot;&gt;07 다음 단계&lt;/a&gt;
&lt;/nav&gt;
&lt;main&gt;
&lt;section id=&quot;overview&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 01&lt;/div&gt;&lt;h2&gt;STEP 4 개요&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;EDA에서 데이터 품질과 산업별 차이 가능성을 확인했으므로, 이제 산업별 금리베타를 실제로 추정한다.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;
&lt;div class=&quot;kpis&quot;&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;kv&quot;&gt;7개 산업&lt;/div&gt;&lt;div class=&quot;kl&quot;&gt;건설·금융·화학·전기전자·철강금속·의약품·운수장비&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;kv&quot;&gt;2,452 거래일&lt;/div&gt;&lt;div class=&quot;kl&quot;&gt;2016.01~2025.12 일별 패널&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;kv&quot;&gt;β_rate&lt;/div&gt;&lt;div class=&quot;kl&quot;&gt;금리 변화에 대한 산업별 민감도&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;kpi&quot;&gt;&lt;div class=&quot;kv&quot;&gt;HAC&lt;/div&gt;&lt;div class=&quot;kl&quot;&gt;일별 데이터 표준오차 보정&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
&lt;h3 class=&quot;sub&quot;&gt;STEP 4의 최종 목표&lt;/h3&gt;&lt;p&gt;각 산업에 대해 &lt;b&gt;금리 변화분의 회귀계수&lt;/b&gt;를 추정하고, 이를 산업별 금리베타로 정리한다. 이 결과는 이후 H1(산업 간 차이 검정)과 H2(시장 전체 상쇄 가설)의 핵심 입력값이 된다.&lt;/p&gt;&lt;div class=&quot;good&quot;&gt;&lt;b&gt;핵심 산출물&lt;/b&gt; — 산업별 금리베타 표, 계수 유의성, 신뢰구간, 산업별 비교 그래프&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;model&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 02&lt;/div&gt;&lt;h2&gt;회귀모형 설계&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;금리효과와 시장 전체 효과를 분리하기 위해 2지수 모형을 사용한다.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;
&lt;h3 class=&quot;sub&quot;&gt;기본 회귀식&lt;/h3&gt;&lt;div class=&quot;formula&quot;&gt;&lt;div class=&quot;f&quot;&gt;industry_return = α + β_rate · d_y3 + γ · kospi_return + ε&lt;/div&gt;&lt;div class=&quot;d&quot;&gt;산업수익률 = 상수항 + 금리효과 + 시장효과 + 오차항&lt;/div&gt;&lt;/div&gt;
&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;구분&lt;/th&gt;&lt;th&gt;변수&lt;/th&gt;&lt;th&gt;의미&lt;/th&gt;&lt;th&gt;역할&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;종속변수&lt;/td&gt;&lt;td&gt;industry_return&lt;/td&gt;&lt;td&gt;특정 산업의 일별 수익률&lt;/td&gt;&lt;td&gt;설명하고자 하는 값&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;핵심 설명변수&lt;/td&gt;&lt;td&gt;d_y3&lt;/td&gt;&lt;td&gt;국고채 3년 금리 변화분&lt;/td&gt;&lt;td&gt;금리베타 추정 변수&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;통제변수&lt;/td&gt;&lt;td&gt;kospi_return&lt;/td&gt;&lt;td&gt;KOSPI 일별 수익률&lt;/td&gt;&lt;td&gt;시장 전체 움직임 제거&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;보조 설명변수&lt;/td&gt;&lt;td&gt;d_y10, d_term_spread&lt;/td&gt;&lt;td&gt;10년 금리 변화분, 장단기 금리차 변화분&lt;/td&gt;&lt;td&gt;강건성 검정&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;div class=&quot;alert&quot;&gt;&lt;b&gt;해석 주의&lt;/b&gt; — β_rate가 음(-)이면 금리 상승 시 해당 산업 수익률이 하락하는 경향, 양(+)이면 상승하는 경향을 의미한다. 단, 이는 KOSPI 움직임을 통제한 뒤의 평균적 관계이다.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;steps&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 03&lt;/div&gt;&lt;h2&gt;구체적인 세부 단계&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;STEP 4는 모형 설계·추정·정리·시각화·해석까지 포함한다.&lt;/p&gt;&lt;div class=&quot;steps&quot;&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;head&quot;&gt;&lt;div class=&quot;no&quot;&gt;1&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;분석용 데이터 최종 확인&lt;/div&gt;&lt;/div&gt;&lt;p&gt;회귀에 사용할 컬럼이 모두 존재하고, 첫 거래일 결측을 제외한 결측치가 없는지 확인한다.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;필수 컬럼: date, industry, industry_return, kospi_return, d_y3&lt;/li&gt;&lt;li&gt;분석 기간: 2016.01~2025.12&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;head&quot;&gt;&lt;div class=&quot;no&quot;&gt;2&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;산업별 데이터 분리&lt;/div&gt;&lt;/div&gt;&lt;p&gt;전체 패널 데이터에서 산업별로 데이터를 나누고, 각 산업에 동일한 회귀식을 적용한다.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;7개 산업별 관측치 수 확인&lt;/li&gt;&lt;li&gt;산업명 표기 통일&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;head&quot;&gt;&lt;div class=&quot;no&quot;&gt;3&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;기본모형 회귀분석 실행&lt;/div&gt;&lt;/div&gt;&lt;p&gt;industry_return을 종속변수로 두고 d_y3와 kospi_return을 설명변수로 넣어 회귀분석을 수행한다.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;β_rate: 금리베타&lt;/li&gt;&lt;li&gt;γ: 시장수익률 민감도&lt;/li&gt;&lt;li&gt;p-value: 금리베타 유의성&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;head&quot;&gt;&lt;div class=&quot;no&quot;&gt;4&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;HAC 표준오차 적용&lt;/div&gt;&lt;/div&gt;&lt;p&gt;일별 수익률 데이터의 자기상관·이분산 가능성을 고려해 Newey-West 방식의 HAC 표준오차를 적용한다.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;최종 보고서에는 HAC 기준 결과 우선 제시&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;head&quot;&gt;&lt;div class=&quot;no&quot;&gt;5&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;산업별 금리베타 결과표 작성&lt;/div&gt;&lt;/div&gt;&lt;p&gt;7개 산업의 β_rate, 표준오차, t값, p값, 신뢰구간을 하나의 표로 통합한다.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;부호: 양(+) / 음(-)&lt;/li&gt;&lt;li&gt;크기: 절댓값 기준 민감도&lt;/li&gt;&lt;li&gt;유의성: p-value 또는 별표 표기&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;step&quot;&gt;&lt;div class=&quot;head&quot;&gt;&lt;div class=&quot;no&quot;&gt;6&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;시각화 및 해석&lt;/div&gt;&lt;/div&gt;&lt;p&gt;산업별 금리베타를 막대그래프 또는 계수 플롯으로 시각화하고, 어떤 산업이 가장 민감한지 해석한다.&lt;/p&gt;&lt;ul&gt;&lt;li&gt;산업별 금리베타 막대그래프&lt;/li&gt;&lt;li&gt;95% 신뢰구간 포함 계수 플롯&lt;/li&gt;&lt;li&gt;양(+) 반응 산업과 음(-) 반응 산업 구분&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;outputs&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 04&lt;/div&gt;&lt;h2&gt;STEP 4 산출물&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;이 단계가 끝나면 H1·H2 분석으로 바로 넘어갈 수 있어야 한다.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;tablewrap&quot;&gt;&lt;table&gt;&lt;thead&gt;&lt;tr&gt;&lt;th&gt;산출물&lt;/th&gt;&lt;th&gt;내용&lt;/th&gt;&lt;th&gt;활용 단계&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;&lt;tbody&gt;
&lt;tr&gt;&lt;td&gt;산업별 회귀 결과표&lt;/td&gt;&lt;td&gt;β_rate, 표준오차, t값, p값, 신뢰구간&lt;/td&gt;&lt;td&gt;STEP 4 결과 제시&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;산업별 금리베타 순위표&lt;/td&gt;&lt;td&gt;절댓값 기준 금리 민감도 순위&lt;/td&gt;&lt;td&gt;산업별 비교 해석&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;금리베타 막대그래프&lt;/td&gt;&lt;td&gt;산업별 β_rate 부호와 크기 비교&lt;/td&gt;&lt;td&gt;보고서·발표자료&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;계수 플롯&lt;/td&gt;&lt;td&gt;β_rate와 95% 신뢰구간 표시&lt;/td&gt;&lt;td&gt;통계적 안정성 확인&lt;/td&gt;&lt;/tr&gt;
&lt;tr&gt;&lt;td&gt;해석 문장 초안&lt;/td&gt;&lt;td&gt;산업별 양/음 반응, 민감도 차이 요약&lt;/td&gt;&lt;td&gt;H1 분석 연결&lt;/td&gt;&lt;/tr&gt;
&lt;/tbody&gt;&lt;/table&gt;&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;roles&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 05&lt;/div&gt;&lt;h2&gt;4인 팀 역할 분담 추천&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;코드 일관성을 유지하면서도 산업별 작업을 병렬로 진행하는 구조가 효율적이다.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;div class=&quot;grid2&quot;&gt;
&lt;div class=&quot;role&quot;&gt;&lt;h4&gt;팀원 1 · 회귀모형/코드 담당&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;회귀식 확정&lt;/li&gt;&lt;li&gt;산업별 회귀 함수 작성&lt;/li&gt;&lt;li&gt;HAC 표준오차 적용&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;role&quot;&gt;&lt;h4&gt;팀원 2 · 산업 A그룹 분석&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;건설업 회귀&lt;/li&gt;&lt;li&gt;금융업 회귀&lt;/li&gt;&lt;li&gt;화학 회귀&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;role&quot;&gt;&lt;h4&gt;팀원 3 · 산업 B그룹 분석&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;전기전자 회귀&lt;/li&gt;&lt;li&gt;철강금속 회귀&lt;/li&gt;&lt;li&gt;의약품·운수장비 회귀&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;div class=&quot;role&quot;&gt;&lt;h4&gt;팀원 4 · 통합/시각화/검증 담당&lt;/h4&gt;&lt;ul&gt;&lt;li&gt;결과표 통합&lt;/li&gt;&lt;li&gt;막대그래프·계수 플롯 제작&lt;/li&gt;&lt;li&gt;H1 검정 준비&lt;/li&gt;&lt;/ul&gt;&lt;/div&gt;
&lt;/div&gt;&lt;div class=&quot;alert&quot;&gt;&lt;b&gt;추천 방식&lt;/b&gt; — 회귀 코드는 한 사람이 통일해서 만들고, 다른 팀원은 동일한 함수로 산업별 결과를 확인하는 방식이 가장 실수와 중복을 줄인다.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;checklist&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 06&lt;/div&gt;&lt;h2&gt;완료 체크리스트&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;아래 항목이 끝나면 STEP 4 완료로 판단할 수 있다.&lt;/p&gt;&lt;div class=&quot;card&quot;&gt;&lt;ul class=&quot;checklist&quot;&gt;
&lt;li&gt;7개 산업 모두 기본 회귀분석을 수행했다.&lt;/li&gt;&lt;li&gt;각 산업별 β_rate, 표준오차, t값, p값을 정리했다.&lt;/li&gt;&lt;li&gt;HAC 표준오차를 적용한 결과를 확보했다.&lt;/li&gt;&lt;li&gt;금리베타의 부호와 크기를 기준으로 산업별 순위를 만들었다.&lt;/li&gt;&lt;li&gt;산업별 금리베타 막대그래프 또는 계수 플롯을 제작했다.&lt;/li&gt;&lt;li&gt;가장 민감한 산업과 가장 둔감한 산업에 대한 해석 초안을 작성했다.&lt;/li&gt;
&lt;/ul&gt;&lt;/div&gt;&lt;/section&gt;

&lt;section id=&quot;next&quot;&gt;&lt;div class=&quot;sec-num&quot;&gt;SECTION 07&lt;/div&gt;&lt;h2&gt;다음 단계&lt;/h2&gt;&lt;p class=&quot;purpose&quot;&gt;STEP 4의 결과는 곧바로 H1·H2 검정으로 이어진다.&lt;/p&gt;&lt;div class=&quot;next&quot;&gt;&lt;div class=&quot;nl&quot;&gt;NEXT STEP&lt;/div&gt;&lt;div class=&quot;nv&quot;&gt;STEP 5 · H1 산업 간 차이 검정&lt;/div&gt;&lt;div class=&quot;nd&quot;&gt;산업별 금리베타가 단순히 달라 보이는 수준을 넘어, 통계적으로 유의하게 다른지 교차항 F-검정으로 확인한다. 이후 시장 전체 금리효과와 산업별 금리효과를 비교하여 H2 상쇄 가설을 검토한다.&lt;/div&gt;&lt;/div&gt;&lt;/section&gt;
&lt;/main&gt;&lt;/div&gt;&lt;/div&gt;
